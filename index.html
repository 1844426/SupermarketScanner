<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Camera Scanner</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #111;
            color: #fff;
            text-align: center;
            padding: 30px;
        }
        .scanner-box {
            background: #222;
            padding: 25px;
            border-radius: 12px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 4px 15px rgba(0,255,0,0.2);
        }
        input[type="file"] {
            display: none;
        }
        .camera-btn {
            background: #28a745;
            color: white;
            padding: 15px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: inline-block;
            margin-top: 15px;
            font-weight: bold;
        }
        .camera-btn:hover {
            background: #218838;
        }
        #preview {
            width: 100%;
            max-height: 250px;
            object-fit: contain;
            margin-top: 15px;
            border-radius: 6px;
            border: 2px dashed #444;
        }
        .status {
            margin-top: 15px;
            font-size: 16px;
            color: #ffc107;
        }
    </style>
</head>
<body>

<div class="scanner-box">
    <h2>📷 Phone Item Scanner</h2>
    <p>Snap a photo of any item to send it instantly to the computer!</p>

    <!-- Hidden file input triggered by camera capture -->
    <label class="camera-btn">
        📸 Snap Product Photo
        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImage(event)">
    </label>

    <br>
    <img id="preview" src="" alt="Scanned item preview will appear here">
    <div class="status" id="statusText">Ready to scan...</div>
</div>

<script>
    function handleImage(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const imageData = e.target.result; // Base64 image string

            // Display preview on phone
            document.getElementById('preview').src = imageData;

            // Create a scanned item package
            const scannedItem = {
                id: Date.now(),
                name: "Scanned Item #" + Math.floor(Math.random() * 1000),
                price: 2.99, // Default price or you can prompt for price
                img: imageData
            };

            // Push to shared localStorage so the computer sees it instantly
            let cart = JSON.parse(localStorage.getItem('shopCart')) || [];
            cart.push(scannedItem);
            localStorage.setItem('shopCart', JSON.stringify(cart));

            document.getElementById('statusText').innerText = "✅ Sent to computer successfully!";
        };
        reader.readAsDataURL(file);
    }
</script>

</body>
</html>
