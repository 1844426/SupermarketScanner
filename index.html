<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone Scanner</title>
    <style>
        body { font-family: Arial, sans-serif; background: #111; color: white; text-align: center; padding: 40px; }
        .box { background: #222; padding: 30px; border-radius: 12px; max-width: 400px; margin: 0 auto; }
        input[type="file"] { display: none; }
        .scan-btn { background: #28a745; color: white; padding: 15px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; display: inline-block; margin-top: 15px; width: 100%; box-sizing: border-box; font-weight: bold; }
        #preview { width: 100%; max-height: 250px; object-fit: contain; margin-top: 15px; border-radius: 6px; display: none; }
        .modal { display: none; position: fixed; z-index: 10; left: 0; top: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); }
        .modal-content { background: #222; color: white; margin: 25% auto; padding: 25px; width: 80%; max-width: 350px; border-radius: 10px; border: 2px solid #ffc107; text-align: center; }
        .modal-content button { padding: 10px 20px; font-size: 16px; margin: 10px 5px; cursor: pointer; border: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

<div class="box">
    <h2>📱 Phone Scanner</h2>
    <p id="instructionText">Ready to scan products.</p>
    <label class="scan-btn" id="snapBtn" style="display:none;">
        📸 Snap Product Photo
        <input type="file" id="cameraInput" accept="image/*" capture="environment" onchange="handleImage(event)">
    </label>
    <img id="preview" alt="Preview">
    <div id="statusText" style="margin-top: 15px; color: #ffc107;"></div>
</div>

<div class="modal" id="addRequestModal">
    <div class="modal-content">
        <h3>🔔 Cashier Request</h3>
        <p>Cashier wants to add an item. Take a picture?</p>
        <button class="success" style="background:#28a745; color:white;" onclick="acceptAddRequest()">Yes</button>
        <button class="danger" style="background:#dc3545; color:white;" onclick="closeModal()">No</button>
    </div>
</div>

<script>
    const BIN_ID = "6af0c856ffd5d16053b19aac";
    const API_KEY = "$2a$10$kxSBPv9NfutB.zoBny1g.5BjiDXXe6P3mSm/3yebuzo8RXmdYlR6";

    let cloudData = {};
    let lastActionTimestamp = localStorage.getItem('lastProcessedAction') || 0;

    async function fetchCloud() {
        try {
            const res = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
                headers: { "X-Master-Key": API_KEY }
            });
            const json = await res.json();
            cloudData = json.record;

            if (cloudData.phoneAction && cloudData.phoneAction.timestamp > lastActionTimestamp) {
                lastActionTimestamp = cloudData.phoneAction.timestamp;
                localStorage.setItem('lastProcessedAction', lastActionTimestamp);
                if (cloudData.phoneAction.action === 'add_request') {
                    document.getElementById('addRequestModal').style.display = 'block';
                }
            }
        } catch (e) { console.error(e); }
    }

    async function saveCloud() {
        try {
            await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
                method: "PUT",
                headers: { "Content-Type": "application/json", "X-Master-Key": API_KEY },
                body: JSON.stringify(cloudData)
            });
        } catch (e) { console.error(e); }
    }

    function acceptAddRequest() {
        document.getElementById('addRequestModal').style.display = 'none';
        document.getElementById('instructionText').innerText = "Snap a photo of the item:";
        document.getElementById('snapBtn').style.display = 'inline-block';
    }

    function closeModal() { document.getElementById('addRequestModal').style.display = 'none'; }

    function handleImage(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            const imgData = e.target.result;
            const preview = document.getElementById('preview');
            preview.src = imgData;
            preview.style.display = 'block';

            if (!cloudData.incomingScans) cloudData.incomingScans = [];
            cloudData.incomingScans.push({ id: Date.now(), name: "Scanned Item", price: 0, img: imgData });
            await saveCloud();

            document.getElementById('statusText').innerText = "✅ Sent to computer!";
            document.getElementById('snapBtn').style.display = 'none';
            setTimeout(() => {
                document.getElementById('statusText').innerText = "";
                document.getElementById('instructionText').innerText = "Ready to scan products.";
                preview.style.display = 'none';
            }, 3000);
        };
        reader.readAsDataURL(file);
    }

    setInterval(fetchCloud, 1500);
    fetchCloud();
</script>
</body>
</html>
